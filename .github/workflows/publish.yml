name: Publish to npm

# Tag-triggered: push a `v*` tag (e.g. `v1.0.0`) and CI publishes that
# version to npm. Use `pnpm release patch|minor|major` locally — it bumps
# every package in packages/*, commits, and tags in one shot (`npm version`
# no longer tags, since the package isn't at the git root); then
# `git push origin main --follow-tags`.
on:
  push:
    tags: ["v*"]

# `id-token: write` is required both for provenance and for npm Trusted
# Publishing (OIDC). `contents: read` is the default minimum for checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # NOTE: no `registry-url` — setting it makes setup-node write an
          # .npmrc that authenticates with `${{ github.token }}` (useless
          # for npm) and npm CLI prefers that token over OIDC, causing a
          # 404. Trusted Publishing does its own registry-URL resolution.

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same safety net as test.yml — don't publish broken code.
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Build before publishing, not only in `prepack`: npm checks `bin`
      # paths before `prepack` runs, and npm 12 removes a `bin` whose file
      # doesn't exist yet from the published package (docs-shell's
      # `dist/cli/index.js`), shipping it without its CLI.
      - name: Build
        run: pnpm build

      - name: Verify tag matches package version and resolve dist-tag
        id: version
        # Two checks in one step:
        # 1. Tag must match package.json — catches the mistake of pushing
        #    `v1.0.1` when package.json still says 1.0.0 (npm would re-publish
        #    1.0.0 and collide).
        # 2. Route prereleases (`2.4.0-rc.1`, `3.0.0-beta.5`, etc.) to the
        #    `next` dist-tag instead of `latest`, so `pnpm add <pkg>` and
        #    consumers with caret ranges never surface an unstable version.
        #    Any version containing `-` is treated as a prerelease (semver).
        # Both packages share one version (pnpm release bumps them together,
        # and registry-shell pins docs-shell at it).
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for pkg in docs-shell registry-shell; do
            PKG=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag v$TAG does not match packages/$pkg version $PKG"
              exit 1
            fi
          done
          PIN=$(node -p "require('./packages/registry-shell/package.json').dependencies['@sntlr/docs-shell']")
          if [ "$TAG" != "$PIN" ]; then
            echo "::error::registry-shell pins @sntlr/docs-shell $PIN, expected $TAG"
            exit 1
          fi
          PKG="$TAG"
          if [[ "$TAG" == *-* ]]; then
            echo "dist=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing $PKG to dist-tag: $(if [[ $TAG == *-* ]]; then echo next; else echo latest; fi)"

      # The engine first: registry-shell depends on that exact version.
      - name: Publish @sntlr/docs-shell
        # See the next step for why npx npm@11 and no token. The package
        # needs its own trusted publisher on npmjs.com (repo + this workflow).
        # The repo is `docs` since the rename from `registry-shell`: a
        # trusted publisher still naming the old repo fails with ENEEDAUTH.
        working-directory: packages/docs-shell
        run: npx npm@11 publish --provenance --tag ${{ steps.version.outputs.dist }}

      - name: Publish @sntlr/registry-shell
        # `npx npm@11` bypasses the hosted runner's preinstalled
        # npm (Node 22 LTS ships npm 10.x, which doesn't support
        # Trusted Publishing / OIDC — added in npm 11.5). We also hit a
        # broken preinstalled npm 10.x that `npm i -g npm@latest` can't
        # recover from ("Cannot find module 'promise-retry'"), so
        # fetching a fresh npm via npx is both the simplest upgrade
        # path and a workaround for the toolcache issue. Pinned to a
        # major rather than `latest`, so a new npm release can't change
        # what gets published (npm 12 dropped docs-shell's bin).
        #
        # No `NODE_AUTH_TOKEN`: npm fetches the GitHub OIDC token
        # (requires `id-token: write` above) and exchanges it with the
        # registry. The package must have a trusted publisher
        # configured on npmjs.com pointing at this repo + workflow.
        # Its `prepack` writes the `shell/*` re-export stubs (docs-shell's
        # `prepack` rebuilds its `dist/`).
        working-directory: packages/registry-shell
        run: npx npm@11 publish --provenance --tag ${{ steps.version.outputs.dist }}
