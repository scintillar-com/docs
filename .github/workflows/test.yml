name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Independent jobs run in parallel so the GitHub UI shows pass/fail
# separately per check (Lint, Type-check, Build, Fixture routes, Docs e2e,
# Unit tests). Each job re-runs its own checkout + install; pnpm's
# cached store keeps that overhead small (~10s on warm cache).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/docs-shell/tsconfig.json covers src/, next-app/, and the
      # Playwright configs. `noEmit: true` is set there, so this is pure
      # type-checking. Root scripts forward to the package.
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Builds each fixture with the real CLI and compares the pages it produced
  # with its committed routes.txt (e.g. a docs-only site must not get
  # registry pages). See scripts/check-fixture-routes.mjs.
  fixture-routes:
    name: Fixture routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:fixtures

  # Docs-only sites end to end (desktop + phone width), against the static
  # exports of fixtures/docs-basic and fixtures/docs-nested. Playwright is a
  # dev dependency of the engine (@sntlr/docs-shell), not of the preset.
  docs-e2e:
    name: Docs e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sntlr/docs-shell exec playwright install --with-deps chromium
      - run: pnpm test:docs

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
